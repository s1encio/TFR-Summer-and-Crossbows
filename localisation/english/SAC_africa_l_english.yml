 SAC_africa_side_support_tt:0 "§YSupport this side§!\nSends §Y500§! infantry equipment to them.\n\nCost: £pol_power §Y25§!  ·  §Y500§! infantry equipment\nYour influence in this country: §G+4§!\nTheir opinion of you: §G+10§!\nCooldown: §Y30 days§! per country.\n\n§RYou cannot switch sides:§! once you support a side in this war, you can only keep supporting that side (as long as it exists).\n§gNot available for yourself, for a side you are at war with, or while on cooldown.§!"
 SAC_africa_act_infra:0 "Build Infrastructure"
 SAC_africa_act_infra_cost:0 "£pol_power §Y25§!   §G+3§! influence"
 SAC_africa_act_infra_tt:0 "§YBuild Infrastructure§!\nRoads and rail links. Adds §Y1§! level of infrastructure.\n\nCost: £pol_power §Y25§!\nYour influence in this country: §G+3§!\nTheir opinion of you: §G+10§!\nCooldown: §Y30 days§! per country (shown on the button).\n\n§gNot available if the country does not exist, you are at war with it, or the action is on cooldown. If the state has no free slot, a new building slot is added.§!"
 SAC_africa_act_civ:0 "Build Civilian Factory"
 SAC_africa_act_civ_cost:0 "£pol_power §Y50§!   §G+5§! influence"
 SAC_africa_act_civ_tt:0 "§YBuild Civilian Factory§!\nAdds §Y1§! civilian factory.\n\nCost: £pol_power §Y50§!\nYour influence in this country: §G+5§!\nTheir opinion of you: §G+10§!\nCooldown: §Y30 days§! per country (shown on the button).\n\n§gNot available if the country does not exist, you are at war with it, or the action is on cooldown. If the state has no free slot, a new building slot is added.§!"
 SAC_africa_act_power:0 "Build Power Plant"
 SAC_africa_act_power_cost:0 "£pol_power §Y50§!   §G+5§! influence"
 SAC_africa_act_power_tt:0 "§YBuild Power Plant§!\nElectricity for the grid. Adds §Y1§! power plant.\n\nCost: £pol_power §Y50§!\nYour influence in this country: §G+5§!\nTheir opinion of you: §G+10§!\nCooldown: §Y30 days§! per country (shown on the button).\n\n§gNot available if the country does not exist, you are at war with it, or the action is on cooldown. If the state has no free slot, a new building slot is added.§!"
 SAC_africa_act_arms:0 "Send Weapons"
 SAC_africa_act_arms_cost:0 "£pol_power §Y15§!  ·  §Y1000§! infantry equipment   §G+4§! influence"
 SAC_africa_act_arms_tt:0 "§YSend Weapons§!\nSends §Y1000§! infantry equipment from your stockpile.\n\nCost: £pol_power §Y15§!  ·  §Y1000§! infantry equipment\nYour influence in this country: §G+4§!\nTheir opinion of you: §G+10§!\nCooldown: §Y30 days§! per country (shown on the button).\n\n§gNot available if the country does not exist, you are at war with it, or the action is on cooldown. If the state has no free slot, a new building slot is added.§!"
 SAC_africa_act_base:0 "Build Military Base"
 SAC_africa_act_base_cost:0 "£pol_power §Y75§!   §G+8§! influence"
 SAC_africa_act_base_tt:0 "§YBuild Military Base§!\nExpands an air base by §Y2§! levels.\n\nCost: £pol_power §Y75§!\nYour influence in this country: §G+8§!\nTheir opinion of you: §G+10§!\nCooldown: §Y30 days§! per country (shown on the button).\n\n§gNot available if the country does not exist, you are at war with it, or the action is on cooldown. If the state has no free slot, a new building slot is added.§!"
 SAC_africa_act_mil:0 "Build Arms Factory"
