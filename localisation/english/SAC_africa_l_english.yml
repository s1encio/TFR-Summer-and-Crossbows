l_english:
 SAC_africa_unlock_tt:0 "Unlocks the §YAfrica§! panel for Wagner, Russia, China, France and the USA. Open it with the §YAfrica button§! on the §Yright side of the screen§!."
 SAC_africa_title:0 "§YAFRICA§! - SPHERES OF INFLUENCE"
 SAC_africa_button_tt:0 "§YAfrica§!\nOpen or close the Africa panel: foreign influence, investments and military aid."
 SAC_africa_leg_none:0 "Contested"
