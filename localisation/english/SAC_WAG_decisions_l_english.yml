 sac_wag.10.t: "Wagner Asks for Sudanese Support"
 sac_wag.10.d: "Wagner has asked us to send troops to support the government of the Central African Republic against the rebel coalition."
 sac_wag.10.a: "Send our troops."
 sac_wag.10.b: "This is not our war."
 sac_wag.11.t: "Sudan Sends Troops"
 sac_wag.11.d: "Sudan has agreed to our request. Two Sudanese brigades are on their way to Bangui to support the government army."
 sac_wag.11.a: "Excellent."
 sac_wag.12.t: "Sudan Refuses"
 sac_wag.12.d: "Sudan has declined to send troops to the Central African Republic."
 sac_wag.12.a: "We will manage without them."
