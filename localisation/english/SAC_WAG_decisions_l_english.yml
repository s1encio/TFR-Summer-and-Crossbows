 sac_wag.1.t: "Orchestra"
 sac_wag.1.d: "Its fighters call themselves \"musicians\", and the company itself \"the Orchestra\". Officially it does not exist: Russian law does not allow private military companies, and the Kremlin denies any connection to it. Yet for six years PMC \"Wagner\" has turned up wherever Moscow wanted results without Russian flags on the ground.\n\nThe group takes its name from the call sign of its commander, Dmitriy Utkin, a former officer of a GRU special forces brigade. It first appeared in 2014, in Crimea and then in the fighting in Donbas. Its men train at a base near Molkino in Krasnodar Krai, beside a regular army special forces unit. The money is widely said to come from the businessman Yevgeny Prigozhin, who has always denied any link.\n\nFrom 2015 Wagner fought for the Syrian government, taking part in the battles for Palmyra and earning a share of the oil and gas fields it helped retake. In February 2018 a Wagner-led column attacking near Deir ez-Zor was struck by American forces, with heavy losses. Since then the company has spread across Africa: advisers in Sudan, instructors and bodyguards for the government of the Central African Republic from 2018, fighters for Khalifa Haftar's offensive on Tripoli in 2019, and a short, costly campaign against insurgents in Mozambique the same year. Mining concessions, oil deals and security contracts follow wherever it goes.\n\nNow, in 2020, the Orchestra is tuning up for its next performance."
 sac_wag.1.a: "Let the music play."
 sac_wag.2.t: "A Call from Moscow"
 sac_wag.2.d: "Late evening in St. Petersburg. Yevgeny Prigozhin sits alone in his office, a stack of contracts and invoices from three continents spread across the desk. Then the secure line rings. Very few people have that number, and none of them call to chat. The voice on the other end comes straight from the Kremlin: French troops have been spotted in the north-east of the Central African Republic, in the regions held by the rebel coalition.\n\n\"This is a clear interference in our interests,\" the voice says. \"We need to secure our interests now, before they put their eye on another country. Do what has to be done.\""
 sac_wag.2.a: "Load up in Ilyusha, we got a job to do."
 WAG_pmc_manpower_tt: "Monthly manpower: §G+300§!"
 WAG_car_coalition: "Central African Security Coalition"
 WAG_car_coalition_tt: "Forms the §YCentral African Security Coalition§! with the §YCentral African Republic§! and declares war on the §YCoalition of Patriots for Change§!.\nThe coalition is §Rdisbanded§! once the war against the CPC is over."
 WAG_unlock_car_war_tt: "Unlocks the §YWar in the CAR§! decisions."
 WAG_expand_wagner_tt: "Two elite, fully equipped divisions, §YPMC Wagner 2§! and §YPMC Wagner 3§!, arrive at the Wagner Airbase."
 WAG_unlock_car_disinfo_tt: "Unlocks §YDisinformation in Central Africa§! and §YEncourage Rebel Defections§! in the §YInternet Research Agency§! decisions."
 WAG_ask_sudan_tt: "§YSudan§! will decide whether to send troops to support the Central African government."
 WAG_car_war_category: "War in the CAR"
 WAG_car_war_category_desc: "Wagner operations in the Central African Republic."
 WAG_car_airlift_supplies: "Airlift Supplies to Bangui"
 WAG_car_airlift_supplies_desc: "Fly Russian small arms and support equipment to the government army."
 WAG_car_raid_rebel_positions: "Raid Rebel Positions"
 WAG_car_raid_rebel_positions_desc: "Strike rebel camps and supply dumps to wear down the coalition."
 WAG_car_expand_airbase: "Expand the Wagner Airbase"
 WAG_car_expand_airbase_desc: "Lengthen the runway and add hangars at our base near Bangui."
 WAG_ira_disinfo_central_africa: "Disinformation in Central Africa"
 WAG_ira_disinfo_central_africa_desc: "Spread demoralising rumours among the rebel coalition."
 WAG_ira_encourage_defections: "Encourage Rebel Defections"
 WAG_ira_encourage_defections_desc: "Promise pay and amnesty to rebels who lay down their arms and join us."
 WAG_logistics_disrupted: "Disrupted Logistics"
 WAG_logistics_disrupted_desc: "Supply routes running through the region have been struck repeatedly."
 WAG_wagner_trained_army: "Wagner-Trained Army"
 WAG_wagner_trained_army_desc: "Wagner instructors have drilled the government army in modern tactics."
 WAG_counter_sabotage: "Counter-Sabotage Operations"
 WAG_counter_sabotage_desc: "Our men hunt down the saboteurs and rebel cells working behind our lines. For a few weeks, the rebel coalition will feel the pressure."
 sac_wag.3.t: "Stabilise the Country"
 sac_wag.3.d: ""
 sac_wag.3.a: "OK"
 sac_wag.10.t: "Wagner Asks for Sudanese Support"
 sac_wag.10.d: "Wagner has asked us to send troops to support the government of the Central African Republic against the rebel coalition."
 sac_wag.10.a: "Send our troops."
 sac_wag.10.a_tt: "Two §YSudanese Expeditionary Brigades§! are sent to Bangui as an expeditionary force under the command of the §YCentral African Republic§!."
 sac_wag.10.b: "This is not our war."
 sac_wag.11.t: "Sudan Sends Troops"
 sac_wag.11.d: "Sudan has agreed to our request. Two Sudanese brigades are on their way to Bangui to support the government army."
 sac_wag.11.a: "Excellent."
 sac_wag.12.t: "Sudan Refuses"
 sac_wag.12.d: "Sudan has declined to send troops to the Central African Republic."
 sac_wag.12.a: "We will manage without them."
 WAG_car_russian_house_idea: "Russian House in Bangui"
 WAG_car_russian_house_idea_desc: "The Russian cultural centre in Bangui wins friends for Moscow, one language course at a time."
 WAG_mining_concessions: "Mining Concessions"
 WAG_mining_concessions_desc: "Our men guard the gold and diamond fields of the Central African Republic and take a share of everything mined there."
 sac_wag.30.t: "A Problem in Bangui"
 sac_wag.30.d: "The war is over, but the country is not getting better. Our men report the same thing from every province: aid convoys that disappear before they arrive, salaries that are never paid, officials who sell the same permit three times. The government in Bangui is corrupt and ineffective. It cannot hold the country together without us, and it no longer even tries.\n\nEverything we have built here rests on a government that is rotting from the inside. It has to be replaced."
 sac_wag.30.a: "Then it will be replaced."
 sac_wag.30.a_tt: "A §Ycoup§! will take place in Bangui in a few days."
 sac_wag.31.t: "Coup in Bangui"
 sac_wag.31.d: "In the early hours of the morning, armoured vehicles took up positions around the presidential palace, the radio station and the airport. By sunrise the government had been dissolved and its ministers placed under guard. The streets of Bangui are quiet; the soldiers who carried out the coup were trained by our instructors, and nobody in the capital doubts who stands behind them.\n\nThe old government is gone. Now we must decide what replaces it."
 sac_wag.31.a: "It is done."
 sac_wag.32.t: "The Future of the Central African Republic"
 sac_wag.32.d: "The palace is empty and the country waits. We can do what everyone already suspects and take the Central African Republic under our own direct control. Or we can leave the choice of a new leader to Moscow, and keep our men where they are useful: in the field, not behind a desk.\n\n§RNote: right now only the \"Wagner takes power\" path is functional. The \"Let Moscow choose\" path is still a work in progress.§!"
 sac_wag.32.a: "Wagner takes power."
 sac_wag.32.b: "Let Moscow choose the new leader. (work in progress)"
 sac_wag.33.t: "A New Leader for Bangui"
 sac_wag.33.d: "After a coup carried out with Wagner's help, the government of the Central African Republic has been removed. Wagner's command has asked Moscow to choose who should lead the country now. Two names are on the table: a general from the presidential guard, respected by the army, and a nationalist politician known for his speeches against French influence."
 sac_wag.33.a: "The general."
 sac_wag.33.b: "The politician."
 sac_wag.34.t: "Moscow Has Chosen"
 sac_wag.34.d: "Moscow has made its decision. [CAR.GetLeader] is the new leader of the Central African Republic. Our contracts stay in place, and so do our men."
 sac_wag.34.a: "Good."
 CAR_SAC_general_ngakola: "Aristide Ngakola"
 CAR_SAC_mokpem: "Jean-Baptiste Mokpem"
