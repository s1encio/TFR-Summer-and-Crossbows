 WAG_kremlin_category: "Relations with the Kremlin"
 WAG_kremlin_category_desc: "Kremlin relations: §Y[?WAG_kremlin_rel|0]§! / 100\n\n§G70 or more:§! Moscow trusts us (more political power, faster construction).\n§R Below 30:§! Moscow distrusts us (less political power and stability), and §YWeapons from Moscow§! is closed.\n\nRelations drift back toward 50 by 1 every month. If we ever march on Moscow, low relations mean the Kremlin is already watching us."
 WAG_krel_gift: "Send a Gift to the Ministry"
 WAG_krel_gift_desc: "A crate of gold from the CAR mines and a few expensive watches for the right people."
 WAG_krel_criticise: "Criticise the Ministry in Public"
 WAG_krel_criticise_desc: "Our men are dying because of incompetent generals, and the country should hear it. Popular at home, not in the Kremlin."
 WAG_krel_supplies: "Ask Moscow for Supplies"
 WAG_krel_supplies_desc: "Needs relations of §Y60§! or more. Moscow sends §Y1000§! infantry equipment and §Y300§! support equipment, but every favour has a price."
