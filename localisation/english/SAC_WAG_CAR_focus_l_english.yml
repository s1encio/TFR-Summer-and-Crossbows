 WAG_car_humanitarian_aid: "Supply Humanitarian Aid"
 WAG_car_humanitarian_aid_desc: "The fighting has left villages without food, clean water or medicine. Convoys from Russia will show the people of the Central African Republic who their real friends are."
 WAG_car_bangui_trials: "Bangui Trials"
 WAG_car_bangui_trials_desc: "Captured rebel commanders and their collaborators will stand trial in Bangui. Justice must be seen to be done."
 WAG_car_russian_house: "Russian House in Bangui"
 WAG_car_russian_house_desc: "A Russian cultural centre in the heart of the capital: language courses, film evenings and scholarships to study in Russia. Friendship that lasts longer than any contract."
 WAG_car_secure_mines: "Secure the Mines"
 WAG_car_secure_mines_desc: "The gold and diamond fields are the lifeblood of the country and the rebels' favourite prize. Our men will guard them, in exchange for a share of what comes out of the ground."
