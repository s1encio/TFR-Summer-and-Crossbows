 WAG_private_military_company_desc: "PMC \"Wagner\" is not a state but a business. Its fighters serve on contract and for pay, answering to the company's leadership rather than to voters, and its men are not easily broken."
 WAG_best_in_hell: "Best in Hell"
 WAG_best_in_hell_desc: "Wagner's fighters are veterans of the hottest and harshest battlefields, from the Syrian desert to the Sahel. Hardened, disciplined and used to brutal conditions, they hold together where others break."
