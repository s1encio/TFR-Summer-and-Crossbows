 WAG_private_military_company: "Private Military Company"
 WAG_private_military_company_desc: "PMC \"Wagner\" is not a state but a business. Its fighters serve on contract and for pay, answering to the company's leadership rather than to voters, and its men are not easily broken."
 WAG_best_in_hell: "Best in Hell"
 WAG_best_in_hell_desc: "Wagner's fighters are veterans of the hottest and harshest battlefields, from the Syrian desert to the Sahel. Hardened, disciplined and used to brutal conditions, they hold together where others break."
 WAG_GATHERING_STORM_DESC: "PMC Wagner is a private military company in all but name an arm of the Russian state. Its men fought in Syria and now sell their services to governments across Africa. When Moscow calls in the summer of 2020, Wagner is sent to the Central African Republic, a country torn apart by civil war, where it will have to turn a contract into a state.\n\n§YCurrent path:§! Wagner Central African Military Administration"
 WAG_country_summary: "§YCountry Summary§!:\nPMC Wagner is officially a private company. In reality, its weapons, its fuel and its orders come from Moscow. Veterans of the war in Syria, its men are now offered to governments across Africa that need security and are willing to pay for it, in money, in contracts or in mining rights.\nIn 2020 the Central African Republic is falling apart. Rebel groups hold most of the country and the government barely controls its own capital. When foreign mercenaries appear alongside the rebels in the summer of 2020, Moscow decides it is time to act, and Wagner is sent to Bangui. What begins as a security contract will end with Wagner deciding who rules the country."
 WAG_country_paths: "\n\n\n\n§YCountry Paths§!:\n§Y - Current path: Wagner Central African Military Administration§!\n§5 - Let Moscow choose a new leader (work in progress)§!"
 WAG_country_other: "§YTips and Tricks:§!\nThe §YAfrica§! panel opens once the CAR is stabilised: use it to build Russian influence across the continent.\n§YA Call from Moscow§! comes at the beginning of §YJuly 2020§! and starts Wagner's road to Bangui."
