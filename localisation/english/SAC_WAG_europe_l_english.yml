 WAG_prisoner_category: "Prisoner Recruitment"
 WAG_prisoner_category_desc: "Our recruiters travel to prison colonies across Russia. Six months at the front for a full pardon."
 WAG_sabotage_category: "Sabotage Behind Enemy Lines"
 WAG_sabotage_category_desc: "Small teams and drones strike targets far behind the front."
 SAC_fpv_company: "FPV Strike Drone Company"
 SAC_fpv_company_desc: "Operators with cheap first-person-view drones carrying explosives. Precise strikes against infantry and vehicles."
 SAC_fpv_strike_drones: "FPV Strike Drones"
 WAG_prisoners_north_caucasus: "Recruit Prisoners in The North Caucasus"
 WAG_prisoners_north_caucasus_desc: "Our recruiters visit the prison colonies of the North Caucasus. Two §YPrisoner Assault Battalions§! will arrive in Molkino."
