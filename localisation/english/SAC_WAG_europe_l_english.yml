l_english:
 WAG_ew_call: "Answer Moscow's Call"
 WAG_ew_call_desc: "Europe is at war, and Moscow is calling every man who can hold a rifle. We have been waiting for this call for years."
 WAG_ew_veterans: "The Veterans Return"
 WAG_ew_veterans_desc: "Men who fought with us in Syria, Libya and Africa are coming back. They know the job, and they know us."
 WAG_ew_car_troops: "Use CAR Troops"
 WAG_ew_car_troops_desc: "The soldiers we trained in Bangui have proven themselves at home. Now they will fight for us in Europe."
 WAG_ew_prisoners: "Recruit Prisoners"
 WAG_ew_prisoners_desc: "Six months at the front for a full pardon. Our recruiters will visit every prison colony in Russia."
 WAG_ew_foreign: "Foreign Legionnaires"
 WAG_ew_foreign_desc: "Volunteers from every country where Russia has friends. They will train in Molkino and fight under our flag."
 WAG_ew_six_weeks: "Six Weeks to the Front"
 WAG_ew_six_weeks_desc: "There is no time for a full training course. Six weeks in Molkino, then the front."
 WAG_ew_corps: "The Wagner Corps"
 WAG_ew_corps_desc: "Battalions become brigades, brigades become a corps. Wagner goes to war as an army."
 WAG_ew_air_bridge: "Air Bridge to the Front"
 WAG_ew_air_bridge_desc: "Our transport planes, once flying to Bangui, now fly men and ammunition from Molkino to the front."
 WAG_ew_drones: "Drone Reconnaissance"
 WAG_ew_drones_desc: "Every assault starts with a drone in the air. We see them before they see us."
 WAG_ew_grinder: "Meat Grinder Assaults"
 WAG_ew_grinder_desc: "Losses do not matter. Only the next trench line matters."
 WAG_ew_shelling: "Mass Artillery Shelling"
 WAG_ew_shelling_desc: "Shells are cheaper than men. Every position will be levelled before our assault groups move in."
 WAG_ew_assault_battalions: "Prisoner Assault Battalions"
 WAG_ew_assault_battalions_desc: "Pardoned prisoners form the first wave. They go forward, and the professionals follow."
 WAG_ew_waves: "Wave After Wave"
 WAG_ew_waves_desc: "When one wave breaks, the next one is already moving up."
 WAG_ew_trenches: "Storm the Trenches"
 WAG_ew_trenches_desc: "Small assault groups, close-range fighting, one trench at a time."
 WAG_ew_spotters: "Artillery Spotters"
 WAG_ew_spotters_desc: "Drones and forward observers find the targets. The guns do the rest."
 WAG_ew_fpv: "FPV Drone Usage"
 WAG_ew_fpv_desc: "Cheap racing drones with explosives strapped to them: the most accurate artillery shell ever made."
 WAG_ew_sabotage: "Sabotage in Their Backlines"
 WAG_ew_sabotage_desc: "Factories, airfields and air defences far behind the front are within our reach."
 WAG_ew_hell: "Best in Hell, at War"
 WAG_ew_hell_desc: "The name was never an exaggeration."
 WAG_ew_repeat: "1941-1945: We Can Repeat"
 WAG_ew_repeat_desc: "Our grandfathers marched to Berlin. We have not forgotten how."

 WAG_ew_prisoners_tt: "Unlocks the §YPrisoner Recruitment§! decisions: recruit §YPrisoner Assault Battalions§! from every region of Russia."
 WAG_ew_foreign_tt: "Unlocks §YRecruit Legionnaires§! in the §YAfrica§! panel (Military tab): in African countries where §RRussian influence§! is §Y50§! or more, a light §YForeign Legionnaires§! division can be recruited in §YMolkino§!."
 WAG_ew_fpv_tt: "Unlocks the §YFPV Strike Drone Company§! support company and adds it to the §YPMC Wagner§! template."
 WAG_ew_sabotage_tt: "Unlocks the §YSabotage Behind Enemy Lines§! decisions: damage enemy military factories, civilian factories, air bases or air defence (£pol_power §Y50§!, cooldown §Y30 days§!)."
