 sac_news.1.t: "Wagner Takes Power in Bangui"
 sac_news.1.d: "Armed units of the Russian private military company Wagner have taken control of the presidential palace and the ministries in Bangui. The company, which helped the government of the Central African Republic win its war against the rebel Coalition of Patriots for Change, has announced that it will run the country itself until further notice.\n\nMoscow has made no official statement. Neighbouring governments have reinforced their borders, and the African Union has called an emergency meeting."
 sac_news.1.a: "The Republic is in safe hands."
 sac_news.1.b: "We will discuss this with them."
 sac_news.1.c: "A company now runs a country."
