l_english:
 WAG_bng_administration: "The Bangui Administration"
 WAG_bng_administration_desc: "The Central African Republic is ours. Not a client, not a partner: ours. Now we have to run it, from the ministries in Bangui to the last checkpoint on the road to Birao."
 WAG_bng_local_chiefs: "Rule Through Local Chiefs"
 WAG_bng_local_chiefs_desc: "The village chiefs and sultans have ruled their people for generations. If they keep the peace and pay their dues, they can keep their seats."
 WAG_bng_direct_rule: "Direct Military Rule"
 WAG_bng_direct_rule_desc: "Every prefecture will answer to one of our officers. It is harsh, but it is fast, and orders will no longer get lost on the way."
 WAG_bng_disarm: "Disarm the Militias"
 WAG_bng_disarm_desc: "The war is over, but half the country still carries a rifle. Weapons will be handed in, bought back or taken."
 WAG_bng_census: "Census and Conscription"
 WAG_bng_census_desc: "Nobody knows how many people live in the north. We will find out, and every able young man will be registered."
 WAG_bng_new_flag: "A New Flag for Bangui"
 WAG_bng_new_flag_desc: "The old flag belongs to the old government. A new state needs new symbols."
 WAG_bng_courts: "Wagner Courts"
 WAG_bng_courts_desc: "Military courts replace the old judges, who could be bought by anyone with a full envelope. Our judges can only be bought by us."
 WAG_bng_liberators: "The Liberators of Bangui"
 WAG_bng_liberators_desc: "Posters, radio programmes and a monument in the capital: the people must remember who ended the war."
 WAG_bng_governorate: "The Military Governorate"
 WAG_bng_governorate_desc: "The emergency is over. What remains is a functioning military state, with clear rules and a clear chain of command."
 WAG_bng_gold_for_guns: "Gold for Guns"
 WAG_bng_gold_for_guns_desc: "The gold from the mines we guard pays for the weapons we need. A simple trade."
 WAG_bng_boali: "The Boali Dam"
 WAG_bng_boali_desc: "Most of Bangui sits in the dark. Repairing the old hydroelectric dam at Boali will bring power back to the capital."
 WAG_bng_timber: "Timber and Diamonds"
 WAG_bng_timber_desc: "The forests of the south-west and the diamond fields of the east can be sold abroad, through our own channels."
 WAG_bng_douala: "The Road to Douala"
 WAG_bng_douala_desc: "Everything this country imports comes by road from the port of Douala in Cameroon. That road must be repaired and protected."
 WAG_bng_supply_lines: "Our Own Supply Lines"
 WAG_bng_supply_lines_desc: "Our own fuel depots, our own workshops, our own transport. Moscow will remain our partner, but no longer our only lifeline."
 WAG_bng_free_zone: "Bangui Free Economic Zone"
 WAG_bng_free_zone_desc: "Low taxes, few questions and our protection: Bangui is open for business."
 WAG_bng_russian_investors: "Russian Investors"
 WAG_bng_russian_investors_desc: "Russian companies get the best contracts. What is good for Moscow is good for us."
 WAG_bng_chinese_credit: "Chinese Credit"
 WAG_bng_chinese_credit_desc: "Chinese banks offer cheap loans and fast construction. The price is Chinese influence in Bangui."
 WAG_bng_self_sufficient: "A Self-Sufficient Company"
 WAG_bng_self_sufficient_desc: "Our state pays for itself: its mines, its factories and its army."
 WAG_bng_contracts: "Professional Contracts"
 WAG_bng_contracts_desc: "Long-term contracts, regular pay, pensions for the families. Men who stay learn, and men who learn survive."
 WAG_bng_academy: "The Wagner Academy"
 WAG_bng_academy_desc: "Our own military school, with our own instructors and our own doctrine."
 WAG_bng_general_staff: "Our Own General Staff"
 WAG_bng_general_staff_desc: "Field commanders win battles. Staff officers win wars. It is time we had both."
 WAG_bng_mil_factories: "Build Our Own Military Factories"
 WAG_bng_mil_factories_desc: "Buying every rifle and shell from Moscow keeps us on a leash. Our own arms factories in Bangui will change that."
 WAG_bng_brigades: "From Companies to Brigades"
 WAG_bng_brigades_desc: "Small assault groups were enough for contracts. A state needs brigades and divisions."
 WAG_bng_armour: "The Armoured Fist"
 WAG_bng_armour_desc: "Trucks, armoured cars and tanks: an army that can cross the savanna in days, not weeks."
 WAG_bng_air_wing: "Our Own Air Wing"
 WAG_bng_air_wing_desc: "Our own planes, helicopters and drones, flying from our own airbase."
 WAG_bng_private_army: "A Private Army"
 WAG_bng_private_army_desc: "We started as a company that rented out soldiers. Now we have an army of our own."
 WAG_bng_kremlin_terms: "The Kremlin's Terms"
 WAG_bng_kremlin_terms_desc: "Moscow has set its conditions for our rule in Bangui. We remain its instrument, but how much room we have depends on us."
 WAG_bng_prove_worth: "Prove Our Worth"
 WAG_bng_prove_worth_desc: "Results speak louder than requests. Every success makes us harder to replace, and gives us more room to act."
 WAG_bng_bargain: "Bargain with the Ministry"
 WAG_bng_bargain_desc: "Gold and contracts for the right people in Moscow, and in return a longer leash for us."
 WAG_bng_ndjamena: "Pressure on N'Djamena"
 WAG_bng_ndjamena_desc: "For years Chad let the rebels cross its border and resupply. N'Djamena will answer for it."
 WAG_bng_darfur: "The Darfur Route"
 WAG_bng_darfur_desc: "The road through Darfur connects us to Port Sudan and the Red Sea. Trade, not war."
 WAG_bng_benghazi: "The Benghazi Connection"
 WAG_bng_benghazi_desc: "Our men in eastern Libya never really left. Fuel, spare parts and flights north all pass through Benghazi."
 WAG_bng_sahel_advisors: "Send Advisors to the Sahel"
 WAG_bng_sahel_advisors_desc: "The governments of the Sahel are tired of Paris and afraid of the jihadists. They need instructors, not lectures."
 WAG_bng_train_burkina: "Train Burkina Faso's Soldiers"
 WAG_bng_train_burkina_desc: "Our instructors arrive in Ouagadougou. In a few months the army of Burkina Faso will fight the way we taught it."
 WAG_bng_train_mali: "Train Mali's Soldiers"
 WAG_bng_train_mali_desc: "Bamako asked for help, and we answered. Malian soldiers will learn from men who have actually won a war."
 WAG_bng_storm: "The Storm in Europe"
 WAG_bng_storm_desc: "Europe is at war. Russia needs every soldier it can find, and we have some of the best."

 WAG_bng_chiefs_idea: "Rule Through Local Chiefs"
 WAG_bng_direct_rule_idea: "Direct Military Rule"
 WAG_bng_governorate_idea: "The Military Governorate"
 WAG_bng_self_sufficient_idea: "A Self-Sufficient Company"
 WAG_bng_academy_idea: "The Wagner Academy"
 WAG_bng_brigades_idea: "Brigade Structure"
 WAG_private_army: "Private Army"
 WAG_private_army_desc: "Wagner is no longer a company that rents out soldiers. It is an army in its own right, with its own state behind it."
 WAG_bng_prove_worth_idea: "Proven Results"
 WAG_bng_no_war_tt: "We are not at war with any African country (a war with §YChad§! is allowed)."
 WAG_bng_storm_avail_tt: "The §YFirst European War§! has begun."
 WAG_bng_china_influence_tt: "Chinese influence in the §YCentral African Republic§! increases by §R10§!."
 WAG_bng_autonomy_loc: "Wagner's autonomy from Moscow"
