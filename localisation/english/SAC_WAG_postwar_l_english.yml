l_english:
 WAG_vic_spoils: "The Spoils of War"
 WAG_vic_spoils_desc: "The depots of the beaten armies are full. German rifles, French guns and British air defence now carry our markings."
 WAG_vic_parade: "Parade on Red Square"
 WAG_vic_parade_desc: "Our columns march past the Kremlin walls with the regular army. For once, the cameras are pointed at us."
 WAG_vic_medals: "Medals for the Musicians"
 WAG_vic_medals_desc: "Every man who went through the European war gets his medal. Veterans teach the recruits, and the recruits listen."
 WAG_vic_brand: "Wagner Is a Brand Now"
 WAG_vic_brand_desc: "Our name is on posters, songs and T-shirts. Young men from all over Russia want to join the company that won the war."
 WAG_vic_vets_fund: "The Veterans' Fund"
 WAG_vic_vets_fund_desc: "Pensions, hospitals and flats for the men who came back. A company that looks after its own does not run short of volunteers."
 WAG_vic_western_machines: "Western Machines to Bangui"
 WAG_vic_western_machines_desc: "Whole production lines are taken apart in Europe, packed into crates and flown south. Bangui gets factories that no aid programme ever paid for."
 WAG_vic_reverse_engineer: "Reverse-Engineer NATO Kit"
 WAG_vic_reverse_engineer_desc: "Our engineers open up every captured rifle, sight and radio. What they learn goes straight into our own workshops."
 WAG_vic_learn_defeated: "Learn from the Defeated"
 WAG_vic_learn_defeated_desc: "Captured staff officers explain how they planned their battles. We take notes."
 WAG_vic_kremlin_offer: "The Kremlin's Offer"
 WAG_vic_kremlin_offer_desc: "Moscow wants us inside the state: a corps of the Ministry of Defence in Africa, with a budget and a uniform. Some of our commanders like the idea. Others do not."
 WAG_vic_africa_corps: "Become the Africa Corps"
 WAG_vic_africa_corps_desc: "We accept. State money, state weapons, state orders. The company becomes a corps, and the corps is very well paid."
 WAG_vic_independent: "Stay Independent"
 WAG_vic_independent_desc: "We thank Moscow politely and decline. We won this war as Wagner, and we stay Wagner."
 WAG_vic_back_africa: "Back to Africa"
 WAG_vic_back_africa_desc: "The war in Europe is over. Our partners in Africa have been waiting, and they have heard who won."
 WAG_vic_sahel: "New Contracts in the Sahel"
 WAG_vic_sahel_desc: "Bamako, Ouagadougou and Niamey sign new contracts: instructors, guards and air support, paid in gold."
 WAG_vic_libya: "The Libya Contract"
 WAG_vic_libya_desc: "Our bases in eastern Libya grow again. Fuel, spare parts and a route north, guarded by our men."
 WAG_vic_superpower: "The Private Superpower"
 WAG_vic_superpower_desc: "An army that won a European war, a state in Africa and contracts on three continents. No company in history has been anything like us."
 WAG_btr_who_lost: "Who Lost the War?"
 WAG_btr_who_lost_desc: "The front collapsed and Russia signed the peace. Our men did not run. So who lost this war?"
 WAG_btr_generals_failed: "The Generals Failed Us"
 WAG_btr_generals_failed_desc: "Shells that never arrived, orders that came too late, reports that lied about everything. The men at the front know exactly who is to blame."
 WAG_btr_kremlin_rotten: "The Kremlin Is Rotten"
 WAG_btr_kremlin_rotten_desc: "The generals answer to the ministers, and the ministers answer to nobody. If Russia is to be saved, it will not be saved by them."
 WAG_btr_boys_home: "Bring the Boys Home"
 WAG_btr_boys_home_desc: "Our divisions leave the front and the CAR and gather in Molkino. Officially they are resting."
 WAG_btr_friends_army: "Friends in the Army"
 WAG_btr_friends_army_desc: "Colonels who fought next to us, majors who owe us their lives. We only ask them one thing: when the day comes, stay in your barracks."
 WAG_btr_lay_low: "Keep Our Heads Down"
 WAG_btr_lay_low_desc: "No interviews, no angry videos, no speeches. Let them think we are licking our wounds."
 WAG_btr_march: "The March of Justice"
 WAG_btr_march_desc: "The columns are ready. Rostov first, then the road north. There will be no second chance."
 WAG_vic_spoils_tt: "Captured §YGerman§!, §YFrench§! and §YBritish§! equipment is added to our stockpile."
 WAG_vic_independent_tt: "The Kremlin will remember that we said no."
 WAG_vic_back_africa_tt: "Our influence grows by §G10§! in every African country where Russian influence is already §Y30§! or more."
 WAG_vic_reverse_engineer: "Reverse-Engineered NATO Kit"
 WAG_vic_medals_idea: "Veterans of the European War"
 WAG_vic_brand_idea: "Wagner Is a Brand"
 WAG_vic_africa_corps_idea: "The Africa Corps"
 WAG_vic_independent_idea: "Our Own Masters"
 WAG_vic_superpower_idea: "The Private Superpower"
 WAG_btr_bitter_idea: "Bitterness in the Ranks"
 WAG_btr_outcasts_idea: "Enemies of the Kremlin"
 WAG_btr_unlock_tt: "Unlocks the §YMarch of Justice§! decisions: raise §YReadiness§! for the mutiny while keeping §RKremlin suspicion§! below 100.\nStarting suspicion is §Y(100 - Kremlin relations) / 2§!. Suspicion rises by §R3§! every month. If it reaches §R100§!, the Kremlin strikes first and the mutiny fails."
 WAG_btr_boys_home_tt: "All our divisions at the §YWagner Airbase§! are flown to §YMolkino§!."
 WAG_btr_march_avail_tt: "Mutiny §YReadiness§! is at least §Y50§!."
 WAG_mutiny_category: "The March of Justice"
 WAG_mutiny_category_desc: "Readiness: §Y[?WAG_mutiny_ready|0]§!   Kremlin suspicion: §R[?WAG_kremlin_susp|0]§!\n\nThe higher our Readiness, the better our chance when we march. If suspicion reaches 100, the Kremlin moves against us first."
 WAG_mut_commanders: "Win Over Regional Commanders"
 WAG_mut_commanders_desc: "Readiness §G+15§!, suspicion §R+10§!."
 WAG_mut_rostov: "Secure the Rostov Headquarters"
 WAG_mut_rostov_desc: "Readiness §G+15§!, suspicion §R+5§!."
 WAG_mut_stockpile: "Stockpile Fuel and Ammunition"
 WAG_mut_stockpile_desc: "Costs §Y1000§! infantry equipment. Readiness §G+10§!."
 WAG_mut_media: "Media Campaign from St Petersburg"
 WAG_mut_media_desc: "Needs our §YHQ in St Petersburg§!. Readiness §G+15§!, suspicion §R+10§!."
 WAG_mut_bribe: "Bribe FSB Officers"
 WAG_mut_bribe_desc: "Suspicion §G-15§!. Can be repeated every 60 days."
 WAG_mutiny_chance_tt: "Chance of success: §Y[?WAG_mutiny_ready|0]%§!"
 WAG_mutiny_success_tt: "We take control of §YRussia§! and continue as Russia. Wagner merges into the Russian state and the §YCentral African Republic§! becomes a puppet."
 WAG_mutiny_failure_tt: "We lose §YMolkino§! and our §YHQ in St Petersburg§!, can no longer buy weapons from Moscow, and are no longer a Russian puppet. In Africa, we now act as §YWagner§!, not Russia."
 sac_wpw.40.t: "Victory in Europe"
 sac_wpw.40.d: "The guns have fallen silent and the European armies have signed the peace on Russia's terms. Our men fought in the hardest sectors of the front, and everyone in Moscow knows it.\n\nThe question now is what Wagner does with a victory this large."
 sac_wpw.40.a: "The spoils are ours."
 sac_wpw.50.t: "The War Is Lost"
 sac_wpw.50.d: "Russia has signed the peace. The front is gone, and with it everything our men bled for. In the barracks of Molkino the same question is asked again and again: who lost this war?"
 sac_wpw.50.a: "Not us."
 sac_wpw.60.t: "The March of Justice"
 sac_wpw.60.d: "Before dawn our columns roll out of Molkino. Checkpoints open, some units of the regular army wave us through, others stay in their barracks. Rostov is taken without a shot. Now the road to Moscow lies open, and everything depends on how well we prepared."
 sac_wpw.60.a: "Forward."
 sac_wpw.61.t: "Moscow Falls"
 sac_wpw.61.d: "The garrisons around the capital refused to fire on us. The ministers have fled or are under arrest, and our commanders now sit in the offices of the General Staff. Wagner no longer serves Russia. Wagner is Russia."
 sac_wpw.61.a: "A new Russia begins today."
 sac_wpw.62.t: "The March Is Stopped"
 sac_wpw.62.d: "Too few units joined us, and the road north was blocked long before Moscow. Our columns turn back. Molkino is surrounded and handed to the army, our St Petersburg offices are raided, and Moscow cuts every tie with the company.\n\nWhat is left of Wagner now lives in Africa."
 sac_wpw.62.a: "Then Africa it is."
 sac_wpw.63.t: "Wagner Joins the State"
 sac_wpw.63.d: "The company has become the state. Its divisions join the Russian army, and the Central African Republic gets a government of its own again, under Moscow's protection."
 sac_wpw.63.a: "Understood."
 sac_wpw.64.t: "The Kremlin Strikes First"
 sac_wpw.64.d: "We were not careful enough. The FSB has arrested our contacts in the army, the regular army has surrounded Molkino, and our offices in St Petersburg have been raided. The march will never start."
 sac_wpw.64.a: "We retreat to Africa."
